{% extends "base.html" %}

{% block title %}booKeeper V0.1.0{% endblock %}

{% block content %}

<!-- this is the collections page! this is actually rendered in the middle of base.html, so go check that out too -->

 <main class="container mx-auto px-4 flex-grow max-w-4xl">
      <div class="flex flex-col items-center justify-center min-h-[70vh]">
        <!--Central Stage-->
        <div class="card bg-base-100 shadow-xl p-6">
          <h2 class="text-xl font-bold mb-4">Enter ISBN</h2>

          <!-- ISBN field lollls! here you type in the isbn -->
          <!-- TODO: make it video scannable frfr-->
          <form action="/add-book" method="POST">
            <input
              name="isbn"
              id="isbn"
              type="text"
              placeholder="Type ISBN here..."
              class="flex flex-col items-center justify-center"
            />
          </form>
        </div>
      </div>
    </main>
    <!-- Folder And Book Parsing-->
    <section
      id="lib-con"
      class="folder-section"
      ondragover="event.preventDefault()"
      hx-post="/api/move-book"
      hx-trigger="drop"
      hx-target="#lib-con"
      hx-swap="outerHTML"
    >

      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
        {% for folder_name, books in collections.items() %}
        <!-- Hey! this renders the books lols ^0^-->
        {% for book in books%}
        <div
          class="card bg-base-100 shadow-xl border border-base-300"
          draggable="true"
          ondragstart="event.dataTransfer.setData('text/plain', '{{ book._id }}')"
        >
        
            <img src="{{ book.cover }}" alt="{{ book.title }}" />
          </a>
          <h4>{{ book.title }}</h4>
        </div>
        {%endfor%}

        {%endfor%}
        <!-- Whew. This should probably work, if this dosent, im gonna shit my pants frfr-->
      </div>
    </section>
<!-- i got a headache writing this ngl.-->
{% endblock %}
