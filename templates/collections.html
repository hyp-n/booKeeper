<!doctype html>
<!-- collections html bro-->
<html lang="en" data-theme="retro">
  <!--TODO: Use an SQLite DB-->
  <head>
    <title>booKeeper - Collections</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--FOntsies-->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <!-- tailwind, htmX and css stuff -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>
  <body class="min-h-screen bg-base-200 flex flex-col">
    <!-- Navigation Bar -->
    <nav class="navbar bg-base-100 shadow-sm justify-center mb-6">
      <div>
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('index') }}"
          >Home</a
        >
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('collection') }}"
          >Collection</a
        >
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('pgcount') }}"
          >Page Count</a
        >
      </div>
    </nav>

    <!-- Main Dtuff -->
    <main class="container mx-auto px-4 flex-grow max-w-4xl">
      <div class="flex flex-col items-center justify-center min-h-[70vh]">
        <!--Central Stage-->
        <div class="card bg-base-100 shadow-xl p-6">
          <h2 class="text-xl font-bold mb-4">Enter ISBN</h2>

          <!-- Give me the isbn! -->
          <form action="/add-book" method="POST">
            <input
              name="isbn"
              id="isbn"
              type="text"
              placeholder="Type ISBN here..."
              class="input w-full max-w-xs shadow-md"
            />
          </form>
        </div>
      </div>
    </main>
    <!-- Folder, And Book Parsing-->
    <section
      id="lib-con"
      class="folder-section"
      ondragover="event.preventDefault()"
      hx-post="/api/move-book"
      hx-trigger="drop"
      hx-target="#lib-con"
      hx-swap="outerHTML"
      hx-vals="js:{
      book_id:event.dataTransfer.getData('text/plain'),
      collection:{{foldername || tojson}}
      }"
    >
      <h2>{{foldername}} || {{books|length}}</h2>
      <div class="book-grid">
        {%for book in books%}
        <!-- python shit dw-->
        <div
          class="book-card"
          draggable="true"
          ondragstart="event.dataTransfer.setData('text/plain', '{{ book._id }}')"
        >
          <a
            href="https://libgen.is/search.php?req={{ book.isbn }}"
            target="_blank"
          >
            <img src="{{ book.cover_url }}" alt="{{ book.title }}" />
          </a>
          <h4>{{ book.title }}</h4>
        </div>
        {%endfor}
        <!-- Whew. This should probably work, if this dosent, im gonna shit my pants frfr-->
      </div>
    </section>
    <!-- this shit was so *beeeeep* hard -->
  </body>
</html>
