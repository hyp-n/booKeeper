<!doctype html>
<!-- page count.html!-->
<html lang="en" data-theme="retro">
  <head>
    <title>booKeeper - Scratch Pad!</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TODO: Add this everywhere-->
    <!--Lucide Icons-->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!--FOntsies-->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main.css') }}"
    />
    <!-- tailwind and css stuff -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="min-h-screen bg-base-200 flex flex-col">
    <!-- Navigation Bar -->
    <nav
      class="navbar bg-base-100 border border-base-300 shadow-[0_4px_20px_rgba(255,255,255,0.2)] justify-center mb-6"
    >
      <div>
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('index') }}"
          >Home</a
        >
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('collection') }}"
          >Collection</a
        >
        <a
          class="btn btn-ghost rounded-full text-xl"
          href="{{ url_for('pgcount') }}"
          >Page Count</a
        >
      </div>
      <div class="navbar-end">
        <i data-lucide="sun" class="w-5 h-5 text-orange-500"></i>
        <input
          type="checkbox"
          id="themetoggle"
          class="toggle border-orange-600 bg-orange-500 checked:border-indigo-600 checked:bg-indigo-500 appearance-none w-9 h-5 rounded-full transition-all cursor-pointer"
        />
        <i data-lucide="moon" class="w-5 h-5 text-purple-600"></i>
      </div>
    </nav>

    <!-- Main Stuff -->

    <script>
      const themetoggle = document.getElementById("themetoggle");

      // uh this checks local storage to know previously selected(or not) theme
      if (localStorage.getItem("theme") == "light") {
        document.documentElement.setAttribute("data-theme", "retro");
      } else {
        document.documentElement.setAttribute("data-theme", "coffee");
        themetoggle.checked = true;
      }

      // Theme Changer Logic
      themetoggle.addEventListener("change", function () {
        if (this.checked) {
          document.documentElement.setAttribute("data-theme", "coffee");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "retro");
          localStorage.setItem("theme", "light");
        }
      });

      lucide.createIcons();
    </script>
  </body>
</html>
